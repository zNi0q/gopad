name: Release

# Tag a commit and push it to cut a release:
#   git tag v1.3.0 && git push origin v1.3.0
#
# Asset names here are a contract with the in-app updater (see assetName() in
# update.go). Renaming them breaks self-update for every installed copy.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build'
        required: true

permissions:
  contents: write

env:
  GO_VERSION: '1.22'

jobs:
  build-linux:
    # ubuntu-22.04 only ships webkit2gtk-4.0, but `make build` (and everyone's
    # local dev/install flow — see the webkit2_41 tag note in the Makefile)
    # links against 4.1, which is what Arch, Fedora 37+, and Ubuntu 22.10+
    # actually have. Building on 22.04 without the matching tag produced a
    # release binary that couldn't even load libwebkit2gtk on those systems —
    # ubuntu-24.04 only has 4.1, which keeps this job honest about it.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      # Wails needs the GTK/WebKit headers to link the webview.
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Build
        run: |
          VERSION="${{ github.event.inputs.tag || github.ref_name }}"
          CGO_ENABLED=1 go build \
            -tags "desktop,production,webkit2_41" \
            -ldflags "-s -w -X main.version=${VERSION}" \
            -o gopad-linux-amd64 .

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: gopad-linux-amd64

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.12.0

      - name: Build
        shell: bash
        run: |
          VERSION="${{ github.event.inputs.tag || github.ref_name }}"
          wails build -platform windows/amd64 -ldflags "-s -w -X main.version=${VERSION}"
          mv build/bin/gopad.exe gopad-windows-amd64.exe

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: gopad-windows-amd64.exe

  release:
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      # The updater refuses to install anything not listed here.
      - name: Generate checksums
        run: sha256sum gopad-linux-amd64 gopad-windows-amd64.exe > SHA256SUMS

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: |
            gopad-linux-amd64
            gopad-windows-amd64.exe
            SHA256SUMS
